# Rules for filtering discovered source pages
# V2: strong/weak signal split + negative signals + source profiles

inclusion_signals:
  strong_title_keywords:
    - "resume"
    - "résumé"
    - "resume guide"
    - "resume template"
    - "sample resume"
    - "action verbs"
    - "resume checklist"
    - "how to write a resume"
    - "cv guide"
    - "cv template"
    - "sample cv"
    - "how to write a cv"

  strong_body_keywords:
    - "resume template"
    - "sample resume"
    - "resume guide"
    - "resume writing"
    - "action verbs"
    - "resume checklist"
    - "resume format"
    - "bullet writing"
    - "cv template"
    - "sample cv"
    - "cv guide"
    - "cv writing"

  weak_url_keywords:
    - "resume"
    - "résumé"
    - "cv"
    - "career"
    - "careers"

  strong_download_keywords:
    - "download template"
    - "sample resume"
    - "sample cv"
    - "resume examples"
    - "cv examples"
    - "action verbs"

negative_signals:
