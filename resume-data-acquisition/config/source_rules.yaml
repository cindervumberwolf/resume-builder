    - "/blog/"
    - "/news/"
    - "/events/"
    - "/event/"
    - "/podcast/"
    - "/stories/"
    - "/alumni/"
    - "/search?"
    - "/catalog/"
    - "searchworks"
    - "reddit.com"
    - "quora.com"

  title_keywords:
    - "employment report"
    - "annual report"
    - "alumni q&a"
    - "student story"
    - "webinar"
    - "workshop"
    - "career fair"
    - "interview prep"
    - "salary negotiation"
    - "cover letter only"
    - "narrative cv"
    - "academic cv"

  body_keywords:
    - "searchworks"
    - "catalog record"
    - "call number"
    - "isbn"
    - "available at library"
    - "request from offsite"
    - "student story"
    - "alumni q&a"
    - "employment report"

